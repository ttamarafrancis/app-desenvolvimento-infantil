<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf4">
  <meta name="description" content="Uma brincadeira de palavras e figuras, no seu ritmo.">
  <title>Encontre a Figura</title>
  <link rel="stylesheet" href="style.css?v=7">
  <script src="script.js?v=7" defer></script>
</head>
<body>
  <div class="decoration sunshine" aria-hidden="true"><span></span></div>
  <div class="decoration leaves leaves-top" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="game" class="game" aria-label="Encontre a Figura">
    <div class="instruction">
      <h1 id="question" tabindex="-1">Preparando…</h1>
      <button id="repeat" class="audio-button" type="button" aria-label="Repetir a pergunta" disabled>
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h5l7-6v20l-7-6H5z" fill="currentColor"/><path d="M22 11c3 3 3 7 0 10m4-14c5 5 5 13 0 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="welcome" class="welcome" hidden><button id="start" class="start-button" type="button">Começar com som <span aria-hidden="true">♫</span></button></div>
    <p id="audio-status" class="audio-status" role="status"></p>
    <audio id="game-audio" preload="auto" aria-label="Áudio da atividade"></audio>
    <div id="choices" class="choices" aria-labelledby="question"></div>
    <div class="celebration"><p id="feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p><div id="stars" class="stars" aria-hidden="true" hidden>✦ ★ ✦</div></div>
    <p id="asset-note" class="sr-only" hidden>Ilustrações temporariamente indisponíveis.</p>
    <noscript>Ative o JavaScript para brincar.</noscript>
  </main>
  <div class="decoration flower" aria-hidden="true">✿</div>
  <div class="decoration leaves leaves-bottom" aria-hidden="true"><i></i><i></i><i></i></div>
</body>
</html>
